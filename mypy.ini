[mypy]
# Treat cli.py as a top-level script (not a package member). Avoids the
# "internxt-cli is not a valid Python package name" hard error.
files = cli.py, services
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
follow_imports = silent
# This codebase is mostly untyped; we want mypy to surface real bugs, not
# nag about every missing annotation.
check_untyped_defs = False
disallow_untyped_defs = False
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True

[mypy-cli]
# cli.py uses dynamic Click decorators heavily; relax a few checks here.
disable_error_code = no-redef, attr-defined
